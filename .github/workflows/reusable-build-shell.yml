name: Reusable Shell Build

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      arch:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/retrage/edk2-nightly:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare sources
        working-directory: /
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/_artifacts/bin
        run: |
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p /src/edk2 "${ARTIFACT_DIR}"
          git clone https://github.com/tianocore/edk2.git --depth 1 /src/edk2
          git -C /src/edk2 submodule update --init --recursive
          make -C /src/edk2/BaseTools

      - name: Build shell
        working-directory: /src/edk2
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/_artifacts/bin
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          export GCC_AARCH64_PREFIX=aarch64-linux-gnu-
          export GCC_LOONGARCH64_PREFIX=loongarch64-linux-gnu-
          export GCC_RISCV64_PREFIX=riscv64-linux-gnu-

          source ./edksetup.sh

          for target in RELEASE DEBUG; do
            build -q \
              -p ShellPkg/ShellPkg.dsc \
              -b "${target}" \
              -a "${TARGET_ARCH}" \
              -t GCC

            src="/src/edk2/Build/Shell/${target}_GCC/${TARGET_ARCH}"
            cp "${src}/Shell_EA4BB293-2D7F-4456-A681-1F22F42CD0BC.efi" \
              "${ARTIFACT_DIR}/${target}${TARGET_ARCH}_Shell.efi"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/_artifacts/bin
